[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "myosuite_mjlab"
version = "0.1.0"
description = "Minimal MyoSuite task integration package for mjlab"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
  "mjlab",
  "mujoco>=3.7.0",
  "torch",
  "rsl-rl-lib",
  "pytest>=9.0.2",
  "myosuite",
  "pre-commit>=4.5.1",
]

[project.scripts]
mjlab-train = "myosuite_mjlab.scripts.train:main"
mjlab-play = "myosuite_mjlab.scripts.play:main"

[dependency-groups]
dev = [
  "pyright>=1.1.408",
  "ruff>=0.14.14",
]

[tool.uv]
override-dependencies = [
  "h5py>=3.12.0",
  "cloudpickle>=3.0.0",
  # Track mjlab, which requires mujoco>=3.7.0 and mujoco-warp>=3.7.0.1.
  "mujoco>=3.7.0",
]

[tool.uv.sources]
myosuite = { git = "https://github.com/MyoHub/myosuite.git", rev = "mjx" }

[tool.hatch.build.targets.wheel]
packages = ["src/myosuite_mjlab"]

[tool.ruff]
line-length = 88

[tool.pyright]
# Relax so pre-commit passes; mjlab/mujoco and dataclass configs are typed at runtime.
reportAttributeAccessIssue = "warning"
reportOptionalMemberAccess = "warning"
reportOperatorIssue = "warning"
reportOptionalOperand = "warning"
reportUndefinedVariable = "warning"
